name: build_kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: set up environment
        run: |
          echo "安装依赖"
          sudo apt update -y
          # gcc-multilib 与 gcc-aarch64-linux-gnu 冲突，不能同时装
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses5-dev libssl-dev lzop python3 zip zstd unzip \
            gcc-aarch64-linux-gnu libelf-dev
      - name: pull kernel and complier
        run: |
          echo "拉取源码和编译器"
          git clone --depth=1 https://github.com/hushunz/android_kernel_xiaomi_mt6885.git -b cgroup-v2 kernel_src
          echo "拉取源码完成"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master
          echo "拉取编译器完成"
      - name: setup toolchain
        run: |
          CLANG="$PWD/proton-clang/bin"
          mv "$CLANG/as" "$CLANG/as.real" 2>/dev/null || true
          cp scripts/as-wrapper "$CLANG/as"
          chmod +x "$CLANG/as"
          echo "as -> $(ls -la $CLANG/as)"
      - name: build kernel
        run: |
          echo "开始编译内核"
          bash build_tool.sh
      - name: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-cezanne
          path: |
            ${{ github.workspace }}/kernel_src/Image.gz
            ${{ github.workspace }}/kernel_src/Image
            ${{ github.workspace }}/kernel_src/dtb
            ${{ github.workspace }}/kernel_src/dtbo.img
